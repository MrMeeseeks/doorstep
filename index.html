<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doorstep — rental manager</title><style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d2a26;--mute:#5d6b66;--line:#e2ddd3;--brand:#1f6f5c;--brand2:#e7f2ee;--warn:#b45309;--warnbg:#fdf3e1;--bad:#b3261e;--badbg:#fbe9e7;--good:#1a7f4b;--goodbg:#e6f4ea;--r:14px}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
h1{font-size:1.6rem;margin:0 0 .2rem}h2{font-size:1.2rem;margin:0 0 .6rem}h3{font-size:1rem;margin:1rem 0 .4rem}
p{margin:.3rem 0 .7rem}a{color:var(--brand)}
.sub{color:var(--mute);margin-bottom:1rem}
.small{font-size:.85rem;color:var(--mute)}
#app{display:flex;min-height:100vh}
nav{width:240px;background:#17352e;color:#fff;padding:1rem .7rem;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
nav .logo{font-size:1.3rem;font-weight:700;padding:.2rem .6rem 1rem}
nav button{display:flex;gap:.6rem;align-items:center;width:100%;background:none;border:0;color:#dbe8e3;font:inherit;text-align:left;padding:.65rem .7rem;border-radius:10px;cursor:pointer;margin-bottom:2px}
nav button:hover{background:#ffffff1a}
nav button.on{background:#fff;color:#17352e;font-weight:600}
nav .badge{margin-left:auto;background:#f2b84b;color:#3b2a00;border-radius:99px;font-size:.75rem;padding:0 .5rem;font-weight:700}
main{flex:1;padding:1.4rem 1.8rem 4rem;max-width:1100px;min-width:0}
.top{display:flex;gap:.8rem;align-items:center;justify-content:flex-end;margin-bottom:.6rem;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;margin-bottom:1rem}
.grid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:1rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.stat .l{color:var(--mute);font-size:.9rem}.stat .v{font-size:1.7rem;font-weight:700;margin:.1rem 0}.stat .h{font-size:.82rem;color:var(--mute)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.btn{font:inherit;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:10px;padding:.55rem .95rem;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--brand)}
.btn.ghost{background:none;border-color:transparent;color:var(--brand);padding:.4rem .5rem}
.btn.del{background:none;border-color:transparent;color:var(--bad);padding:.3rem .5rem;font-weight:400}
.btn.sm{padding:.3rem .65rem;font-size:.88rem}
.btn:focus-visible,.in:focus-visible,nav button:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.in,select,textarea{font:inherit;border:1px solid #c9c2b5;border-radius:8px;padding:.42rem .55rem;background:#fff;color:var(--ink);max-width:100%}
input[type=number].in{width:120px;text-align:right}
textarea{width:100%;min-height:9rem;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:.2rem;font-size:.9rem;color:var(--mute);min-width:150px}
label.f .in,label.f select{color:var(--ink)}
.form{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:.6rem 0 1rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.82rem;color:var(--mute);font-weight:600;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
td{padding:.45rem .5rem;border-bottom:1px solid #efebe3;vertical-align:middle}
td.n,th.n{text-align:right}
.tw{overflow-x:auto}
.chip{display:inline-block;border-radius:99px;padding:.1rem .6rem;font-size:.8rem;font-weight:600;background:#eee;color:#444;white-space:nowrap}
.chip.g{background:var(--goodbg);color:var(--good)}.chip.w{background:var(--warnbg);color:var(--warn)}.chip.b{background:var(--badbg);color:var(--bad)}.chip.i{background:var(--brand2);color:var(--brand)}
.note{background:var(--brand2);border-radius:10px;padding:.7rem .9rem;margin:.6rem 0;font-size:.92rem}
.note.w{background:var(--warnbg)}.note.b{background:var(--badbg)}
.todo{display:flex;gap:.7rem;align-items:center;padding:.6rem 0;border-bottom:1px solid #efebe3}
.todo:last-child{border:0}.todo .t{flex:1}
.dot{width:.7rem;height:.7rem;border-radius:50%;flex-shrink:0}.dot.high{background:var(--bad)}.dot.med{background:#e0a100}.dot.low{background:#8aa39b}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:.5rem 0}
.bar div{min-width:2px}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.86rem}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.big{font-size:2.6rem;font-weight:800}
.week{display:grid;grid-template-columns:8.5rem 1fr 1fr;gap:.5rem;padding:.5rem .3rem;border-bottom:1px solid #efebe3;align-items:center}
.week.now{background:var(--brand2);border-radius:8px}
.me{background:#fff3c4;border-radius:6px;padding:0 .3rem;font-weight:700}
.doc{white-space:pre-wrap;font-family:Georgia,serif;background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:1rem;max-height:22rem;overflow:auto;font-size:.92rem}
.lock{max-width:340px;margin:18vh auto;text-align:center}
ul.tight{margin:.3rem 0;padding-left:1.2rem}ul.tight li{margin:.15rem 0}
.banner{background:#fff3c4;border:1px solid #ecd67a;border-radius:10px;padding:.6rem .9rem;margin-bottom:1rem;display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#17352e;color:#fff;padding:.6rem 1rem;border-radius:10px;z-index:9;box-shadow:0 4px 16px #0004}
@media(max-width:820px){
 #app{flex-direction:column}
 nav{width:100%;height:auto;position:sticky;top:0;z-index:5;display:flex;overflow-x:auto;padding:.4rem;gap:.2rem}
 nav .logo{display:none}nav button{width:auto;white-space:nowrap;margin:0;padding:.5rem .7rem}
 main{padding:1rem .8rem 4rem}
 .week{grid-template-columns:1fr}
}
@media print{nav,.top,.btn,.banner,.noprint{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card,.stat{break-inside:avoid}}
.ph{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.4rem 0 .8rem}
.ph figure{margin:0;position:relative}
.ph img{width:104px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ph .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:.75rem;cursor:pointer;line-height:1}

/* ---------- lookups ---------- */
const byId = (list, id) => list.find(x => x.id === id);
const propsOf = pf => S.properties.filter(p => p.pf === pf);
const unitsOf = pid => S.units.filter(u => u.prop === pid);

/* ---------- money math ---------- */
// Canadian fixed mortgages compound twice a year.
const mRate = annualPct => Math.pow(1 + (annualPct || 0) / 200, 1 / 6) - 1;
function mortgagePay(bal, ratePct, years) {
  const i = mRate(ratePct), n = (years || 25) * 12;
  if (!bal) return 0;
  return i ? bal * i / (1 - Math.pow(1 + i, -n)) : bal / n;
}
const perMonth = e => e.per === 'y' ? (e.amount || 0) / 12 : (e.amount || 0);
function propFin(p) {
  const us = unitsOf(p.id);
  const potential = us.reduce((a, u) => a + (u.rent || 0), 0);
  const rent = us.filter(u => u.tenant).reduce((a, u) => a + (u.rent || 0), 0);
  const opex = p.expenses.reduce((a, e) => a + perMonth(e), 0);
  const m = p.mortgage || {};
  const pay = m.payment > 0 ? m.payment : mortgagePay(m.balance, m.rate, m.years);
  const interest = Math.min(pay, (m.balance || 0) * mRate(m.rate));
  const principal = Math.max(0, pay - interest);
  const noi = rent - opex, cash = noi - pay;
  return { potential, rent, vacancy: potential - rent, opex, pay, interest, principal, noi, cash,
    value: p.value || 0, equity: (p.value || 0) - (m.balance || 0), invested: p.invested || 0,
    cap: p.value ? noi * 12 / p.value : NaN, coc: p.invested ? cash * 12 / p.invested : NaN,
    roi: p.invested ? (cash + principal) * 12 / p.invested : NaN,
    rooms: us.length, empty: us.filter(u => !u.tenant).length };
}
function pfFin(pf) {
  const keys = ['potential', 'rent', 'vacancy', 'opex', 'pay', 'interest', 'principal', 'noi', 'cash', 'value', 'equity', 'invested', 'rooms', 'empty'];
  const t = Object.fromEntries(keys.map(k => [k, 0]));
  propsOf(pf.id).forEach(p => { const f = propFin(p); keys.forEach(k => t[k] += f[k]); });
  t.cap = t.value ? t.noi * 12 / t.value : NaN;
  t.coc = t.invested ? t.cash * 12 / t.invested : NaN;
  t.roi = t.invested ? (t.cash + t.principal) * 12 / t.invested : NaN;
  t.fee = pf.kind === 'managed' ? t.rent * (pf.feePct || 0) / 100 : 0;
  return t;
}
function renoCalc(r) {
  const total = (r.cost || 0) + (r.lost || 0);
  const yearly = (r.rentUp || 0) * 12;
  const loanPay = r.financed ? mortgagePay(r.cost, r.rate, r.years) * 12 : 0;
  const payback = yearly > 0 ? total / yearly : Infinity;
  const roi = total ? yearly / total : NaN;
  let interest5 = 0;
  if (r.financed) { let bal = r.cost || 0; const i = mRate(r.rate), pm = loanPay / 12; for (let k = 0; k < 60 && bal > 0; k++) { const it = bal * i; interest5 += it; bal -= pm - it; } }
  const five = yearly * 5 + (r.valueUp || 0) - total - interest5;
  let verdict = ['b', 'Probably not worth it for the rent alone'];
  if (payback <= 3) verdict = ['g', 'Strong — pays for itself in ' + payback.toFixed(1) + ' years'];
  else if (payback <= 6) verdict = ['w', 'Okay — pays for itself in ' + payback.toFixed(1) + ' years'];
  else if (isFinite(payback)) verdict = ['b', 'Slow — takes ' + payback.toFixed(1) + ' years to pay back'];
  return { total, yearly, loanPay, payback, roi, five, verdict };
}

/* ---------- cleaning and garbage rotation ---------- */
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function mondayOf(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function weekIdx(p, date) { return Math.round((mondayOf(date) - mondayOf(pDate(p.choreStart || '2026-01-05'))) / 6048e5); }
const mod = (a, n) => ((a % n) + n) % n;
function floorTenants(p, fid) { return unitsOf(p.id).filter(u => u.floor === fid && u.tenant).map(u => byId(S.tenants, u.tenant)).filter(Boolean); }
function cleanerFor(p, fid, w) { const l = floorTenants(p, fid); return l.length ? l[mod(w, l.length)] : null; }
// Garbage rotates through everyone in the house, arranged so nobody gets cleaning and garbage in the same week.
function garbageOrder(p) {
  const pool = [];
  p.floors.forEach(f => { const l = floorTenants(p, f.id); l.forEach((t, i) => pool.push({ t, i, n: l.length, f: f.id })); });
  const out = []; let lastF = null;
  for (let pos = 0; pos < pool.length; pos++) {
    const free = pool.filter(x => !out.includes(x));
    const ok = free.filter(x => x.n < 2 || mod(pos, x.n) !== x.i);
    const pick = (ok.find(x => x.f !== lastF) || ok[0] || free[0]);
    out.push(pick); lastF = pick.f;
  }
  return out.map(x => x.t);
}
function garbageFor(p, w) {

  const cnt = new Map(l.map(t => [t, 0])), last = new Map(l.map((t, i) => [t, i - 100])); let pick;
  for (let k = 0; k <= w; k++) {

    pick = pool.reduce((a, b) => (cnt.get(b) < cnt.get(a) || (cnt.get(b) === cnt.get(a) && last.get(b) < last.get(a))) ? b : a);

const wasteType = (p, w) => (mod(w, 2) === 0) !== !!p.wasteFlip ? 'Garbage' : 'Recycling';

const dn = s => pDate(s).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
const cityCal = p => (typeof CITY !== 'undefined' && p.cityCal && CITY.cal[p.cityCal]) || null;
const wasteDayOf = p => cityCal(p) ? DAYS.indexOf(p.cityCal.replace(/\d+$/, '')) : (p.wasteDay ?? 2);
// What the truck takes in the week starting monIso. Uses the City of Toronto's published dates when a calendar is chosen.
function pickupFor(p, monIso, w) {
  const cal = cityCal(p), day = wasteDayOf(p), guess = addDays(monIso, mod(day - 1, 7));

  for (let i = 0; i < 7; i++) { const d = addDays(monIso, i), f = cal[d];
    if (f !== undefined) return { date: d, waste: f.includes('G') ? 'Garbage' : 'Recycling', extra: (f.includes('Y') ? ' + yard waste' : '') + (f.includes('X') ? ' + Christmas trees' : ''), official: true }; }
  // Past the last date the City has published: keep alternating from the last known week.

      clean: p.floors.map(f => ({ f, t: cleanerFor(p, f.id, w0 + k) })) });

}

/* ---------- rent rules ---------- */
function increaseInfo(t) {
  const u = tenantUnit(t.id); if (!u || !t.leaseStart) return null;
  const base = t.lastIncrease || t.leaseStart;
  const next = pDate(base); next.setFullYear(next.getFullYear() + 1);
  const g = GUIDELINE[next.getFullYear()] ?? GUIDELINE[2027];
  const notice = new Date(next); notice.setDate(notice.getDate() - 90);
  return { next: iso(next), noticeBy: iso(notice), g, up: Math.round(u.rent * g) / 100, daysToNotice: daysBetween(today(), iso(notice)) };
}

function findings(pf) {
  const out = [], add = (sev, text, view, tip) => out.push({ sev, text, view, tip });
  const mk = monthKey(), paid = S.payments[mk] || {}, dom = new Date().getDate();
  if (S.sample) add('med', 'The app still has example numbers. Replace them with your real rents, mortgage and bills.', 'properties');
  propsOf(pf.id).forEach(p => {
    const f = propFin(p);
    unitsOf(p.id).forEach(u => {
      if (!u.tenant) {
        add('high', `${u.name} at ${p.name} is empty — that costs about ${money(u.rent / 30)} every day.`, 'market');
        const ad = S.ads[u.id], posts = ad ? Object.values(ad.ch || {}).filter(c => c.posted) : [];
        if (!posts.length) add('high', `No ad is posted yet for ${u.name}.`, 'market');
        else if (posts.every(c => daysBetween(c.posted, today()) > 7)) add('med', `The ads for ${u.name} are more than a week old. Refresh them so they go back to the top.`, 'market');
      } else if (u.market > u.rent * 1.05) add('low', `${u.name} rents for ${money(u.rent)} but similar rooms get about ${money(u.market)}. Use the higher price when the next tenant moves in.`, 'properties');
    });
    if (f.cash < 0 && pf.kind === 'owned') add('high', `${p.name} loses ${money(-f.cash)} a month after the mortgage and bills.`, 'money');
    if (f.rent && f.opex / f.rent > 0.5) add('low', `Bills at ${p.name} take ${pct(f.opex / f.rent)} of the rent. Worth checking insurance and utility prices.`, 'properties');
    if (unitsOf(p.id).length >= 4 && /toronto|north york|scarborough|etobicoke/i.test(p.address) && !(p.compliance || {}).licence)
      add('high', `${p.name} has 4 or more rented rooms. Toronto requires a multi-tenant house licence — tick it off once you have it.`, 'contracts');
  });
  propsOf(pf.id).forEach(p => { if (p.floors.length && /toronto|north york|scarborough|etobicoke/i.test(p.address) && !cityCal(p)) add('low', `Choose the City pickup calendar for ${p.name} so garbage weeks and holiday changes are always right.`, 'chores'); });
  pfTenants(pf.id).forEach(t => {
    const u = tenantUnit(t.id), p = byId(S.properties, u.prop);
    if (dom > 3 && !paid[t.id]) add('high', `${t.name} (${u.name}) has not been marked as paid for this month.`, 'money');
    if (!t.email) add('low', `${t.name} has no email saved, so documents cannot be sent.`, 'people');
    const docs = S.docs.filter(d => d.tenant === t.id);
    if (p.camera && !docs.some(d => d.kind === 'camera' && d.status === 'signed')) add('med', `${t.name} has not signed the outdoor camera notice.`, 'contracts');
    if (p.floors.length && !docs.some(d => d.kind === 'rules' && d.status === 'signed')) add('low', `${t.name} has not signed the house rules and cleaning agreement.`, 'contracts');
    const inc = increaseInfo(t);
    if (inc && inc.daysToNotice <= 30) add('med', `${t.name}: you can raise the rent by up to ${inc.g}% (${money(inc.up, 2)} a month) from ${nice(inc.next)}. Form N1 must be given by ${nice(inc.noticeBy)}.`, 'contracts');
  });
  const lb = S.settings.lastBackup;
  if (!lb || daysBetween(lb, today()) > 7) add('low', 'No backup saved in the last week. Save one so your numbers are never lost.', 'settings');
  return out;
}

async function pack(obj) {
  let bytes = new TextEncoder().encode(JSON.stringify(obj)), z = '0';
  if (window.CompressionStream) { bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); z = '1'; }
  let b = ''; bytes.forEach(c => b += String.fromCharCode(c));
  return z + btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function unpack(s) {
  let bytes = Uint8Array.from(atob(s.slice(1).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  if (s[0] === '1') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(bytes));
}

const fdb = () => new Promise((res, rej) => { const r = indexedDB.open('doorstep-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const fop = async (mode, fn) => { const db = await fdb(); return new Promise((res, rej) => { const tx = db.transaction('f', mode), q = fn(tx.objectStore('f')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); };
const fput = (id, blob) => fop('readwrite', s => s.put(blob, id));
const fget = id => fop('readonly', s => s.get(id));
const fdel = id => fop('readwrite', s => s.delete(id));
async function allFileData() { const o = {}; for (const f of S.files) { const b = await fget(f.id); if (b) o[f.id] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); } return o; }
async function restoreFiles(o) { for (const [id, u] of Object.entries(o)) await fput(id, await (await fetch(u)).blob()); }
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

const LCAT = ['Rent', 'Other income', 'Mortgage payment', 'Property tax', 'Insurance', 'Utilities', 'Repairs', 'Renovation', 'Management or legal fees', 'Other cost'];
const isIncome = c => c === 'Rent' || c === 'Other income';

/* ---------- where she stands ---------- */
function standing(pf) {
  const pids = propsOf(pf.id).map(p => p.id), years = {}, Y = y => (years[y] ??= { inc: 0, out: 0, reno: 0 });
  S.ledger.filter(l => l.pf === pf.id).forEach(l => { const y = Y((l.date || today()).slice(0, 4)); if (isIncome(l.cat)) y.inc += l.amount || 0; else y.out += l.amount || 0; });
  S.pastRenos.filter(r => pids.includes(r.prop)).forEach(r => { Y((r.date || today()).slice(0, 4)).reno += r.cost || 0; });
  const tids = pfTenants(pf.id).map(t => t.id); let paid = 0;
  Object.entries(S.payments).forEach(([m, o]) => Object.keys(o).forEach(tid => { if (tids.includes(tid)) { const r = tenantUnit(tid).rent || 0; Y(m.slice(0, 4)).inc += r; paid += r; } }));
  const t = Object.values(years).reduce((a, y) => ({ inc: a.inc + y.inc, out: a.out + y.out, reno: a.reno + y.reno }), { inc: 0, out: 0, reno: 0 });
  return { years, ...t, paid, net: t.inc - t.out - t.reno };
}

function csvRows(text) { return text.split(/\r?\n/).filter(l => l.trim()).map(l => (l.match(/("([^"]|"")*"|[^,]*)(,|$)/g) || []).map(c => c.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"').trim())).map(r => { while (r.length && r[r.length - 1] === '') r.pop(); return r; }); }
function csvDate(s) { let m; if ((m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`; if ((m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})/))) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`; const d = new Date(s); return isNaN(d) ? '' : iso(d); }

  return `<h1>Weekly check-up</h1><div class="sub">Once a week the app checks everything for you: money, empty rooms, paperwork, and how you use the app.</div>
  <div class="card"><div class="row sp"><div><div class="l small">Health score for ${esc(pf.name)}</div><div class="big ${score >= 80 ? 'pos' : score < 50 ? 'neg' : ''}">${score}<span style="font-size:1.2rem;color:var(--mute)"> / 100</span></div><div class="small">Last check: ${nice(S.qc.last)}${prev ? ` · before that: ${prev.score}` : ''} · next automatic check: ${nice(iso(new Date(pDate(S.qc.last || today()).getTime() + 7 * 864e5)))}</div></div><button class="btn" data-act="runQC">Check again now</button></div></div>
  ${grp.map(([s, l]) => { const x = fs.filter(f => f.sev === s); return x.length ? `<div class="card"><h2>${l} (${x.length})</h2>${x.map(todoRow).join('')}</div>` : ''; }).join('') || '<div class="card"><p>Nothing to fix. Well done. 🌿</p></div>'}
  <div class="card"><h2>Your habits</h2><p>You opened the app on <b>${h.last14}</b> of the last 14 days.${h.last14 < 2 ? ' A quick look twice a week is enough to catch late rent and stale ads.' : ''}</p>
  ${h.tips.length ? `<ul class="tight">${h.tips.map(t => `<li>${t}</li>`).join('')}</ul>` : '<p>You are using every part of the app. Nothing to suggest.</p>'}
  <p class="small">The Home page shortcuts re-order themselves to match the screens you open most.</p></div>
  ${S.qc.reports.length > 1 ? `<div class="card"><h2>Past check-ups</h2><div class="tw"><table><tr><th>Date</th><th class="n">Score</th><th class="n">Items found</th></tr>${S.qc.reports.slice(0, 10).map(r => `<tr><td>${nice(r.date)}${r.auto ? '' : ' (manual)'}</td><td class="n">${r.score}</td><td class="n">${r.n}</td></tr>`).join('')}</table></div></div>` : ''}`;
};
A.runQC = () => { runQC(false); toast('Check-up done'); };

/* ---------------- Room photos (kept on this device, shrunk to save space) ---------------- */
let PH = {};
try { PH = JSON.parse(localStorage.getItem('doorstep.photos')) || {}; } catch (e) { }
function savePhotos() { try { localStorage.setItem('doorstep.photos', JSON.stringify(PH)); return true; } catch (e) { return false; } }
function photoStrip(u) {
  const l = PH[u.id] || [];
  return `<div class="ph">${l.map((d, i) => `<figure><a href="${d}" download="${esc(u.name.replace(/\W+/g, '-'))}-${i + 1}.jpg" title="Tap to save this photo"><img src="${d}" alt="${esc(u.name)} photo ${i + 1}"></a><button class="x" data-act="delPhoto" data-arg="${u.id}|${i}" aria-label="Remove photo ${i + 1} of ${esc(u.name)}">✕</button></figure>`).join('')}<label class="btn sec sm" style="cursor:pointer">📷 Add photos<input type="file" accept="image/*" multiple hidden data-photo="${u.id}"></label>${l.length ? '' : '<span class="small">No photos yet</span>'}</div>`;
}
function shrink(file) {
  return new Promise((res, rej) => { const img = new Image();
    img.onload = () => { const k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', 0.62)); };
    img.onerror = rej; img.src = URL.createObjectURL(file); });
}
document.addEventListener('change', async e => {
  const el = e.target; if (!el.dataset || !el.dataset.photo) return;
  const l = (PH[el.dataset.photo] ??= []); let skipped = 0, full = false;
  for (const f of el.files) {
    if (l.length >= 10) { skipped++; continue; }
    try { l.push(await shrink(f)); if (!savePhotos()) { l.pop(); savePhotos(); full = true; break; } } catch (x) { skipped++; }
  }
  render();
  toast(full ? 'This device has no more space for photos. Remove a few first.' : skipped ? `${skipped} could not be added (10 photos per room at most)` : 'Photos added');
});
A.delPhoto = arg => { const [u, i] = arg.split('|'); PH[u].splice(Number(i), 1); savePhotos(); };

/* ---------------- Settings ---------------- */
V.settings = () => `<h1>Settings</h1><div class="sub">Your details appear on ads and documents.</div>
  <div class="card"><h2>About you</h2><div class="form">${field('Your name', txt('settings.landlord', S.settings.landlord))}${field('Email', txt('settings.email', S.settings.email, '', 'email'))}${field('Phone', txt('settings.phone', S.settings.phone, '', 'tel'))}${field('PIN to open the app (optional)', txt('settings.pin', S.settings.pin, 'e.g. 4 digits', 'password'))}</div><p class="small">The PIN keeps family or visitors from opening the app on this computer. Leave it empty for no PIN.</p></div>
  <div class="card"><h2>Backup</h2><p>Everything is saved in this browser on this computer. Save a backup file every week so nothing is lost if the computer breaks.</p><p class="small">Last backup: ${nice(S.settings.lastBackup)}</p>
  <div class="row"><button class="btn" data-act="backup">⬇️ Save a backup file</button><label class="btn sec" style="cursor:pointer">⬆️ Open a backup file<input type="file" id="restore" accept=".json" hidden></label></div></div>
  <div class="card"><h2>Use it on another device</h2><p>Sends a copy of everything to your own email as a link. Open that email on the new phone or computer, tap the link, and all your numbers appear there.</p>
  <div class="row"><button class="btn" data-act="emailCopy">✉️ Send a copy to my email</button></div><p class="small">The link contains all your information, so only send it to yourself. Each device keeps its own copy: after changing things on one device, send a fresh copy to the other. Room photos and uploaded documents are too big for the link — use the backup file to move those.</p></div>
  <div class="card"><h2>Start over</h2><p>Erases everything in the app on this computer and brings back the example numbers.</p><button class="btn del" data-act="reset" data-confirm="1">Erase everything</button></div>`;
A.backup = async () => { S.settings.lastBackup = today(); save(); dl(`doorstep-backup-${today()}.json`, JSON.stringify({ ...S, photos: PH, fileData: await allFileData() }), 'application/json'); toast('Backup saved to your Downloads folder'); };
A.reset = () => { S = seed(); PH = {}; savePhotos(); };
let PEND = null;
A.emailCopy = async () => {
  if (!isHosted()) { toast('This works from the web address, not from the file'); return; }
  if (!S.settings.email) { toast('Type your email under “About you” first'); return; }
  S.settings.lastBackup = today(); save();
  const link = location.href.split('#')[0] + '#r=' + await pack(S);
  await copy(link);
  const short = link.length < 1800;
  location.href = `mailto:${encodeURIComponent(S.settings.email)}?subject=${encodeURIComponent('My Doorstep copy — ' + nice(today()))}&body=${encodeURIComponent('Open this link on the new device to load everything:\n\n' + (short ? link : '(paste the link here — it is already copied)') + '\n')}`;
  toast(short ? 'Your email opened. Press Send.' : 'Your email opened. Paste the copied link into it, then press Send.');
};
A.restoreYes = () => { S = PEND; PEND = null; unlocked = false; history.replaceState(null, '', location.pathname); toast('Your copy is now on this device'); };
A.restoreNo = () => { PEND = null; history.replaceState(null, '', location.pathname); load(); };
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'restore' && el.files[0]) el.files[0].text().then(tx => { try { const d = JSON.parse(tx); if (!d.v || !d.properties) throw 0; PH = d.photos || {}; delete d.photos; savePhotos(); if (d.fileData) { restoreFiles(d.fileData); delete d.fileData; } S = d; save(); render(); toast('Backup opened'); } catch (x) { toast('That file is not a Doorstep backup'); } });
});
A.flipWaste = pid => { const p = byId(S.properties, pid); p.wasteFlip = !p.wasteFlip; };

/* ---------------- The tenant's private page ---------------- */
let TP = null;
function renderTenant() {
  const d = TP, me = x => x === d.n ? `<span class="me">${esc(x)} (you)</span>` : esc(x), signed = JSON.parse(localStorage.getItem('doorstep.signed') || '{}');
  document.title = 'Your home — ' + d.u;
  $('#app').innerHTML = `<main style="margin:0 auto;max-width:760px"><h1>Hello, ${esc(d.n.split(' ')[0])} 👋</h1><div class="sub">${esc(d.u)} · ${esc(d.a)} · this page is private to you</div>
  ${d.sch.length ? `<div class="card"><h2>This week</h2><p>🧹 Cleaning (${esc(d.fl)}): ${me(d.sch[0].c)}<br>🗑️ ${esc(d.sch[0].w)} to the curb (${dn(addDays(d.sch[0].pk, -1))} night): ${me(d.sch[0].g)}</p><p><button class="btn sec" data-act="tIcs">📅 Add my turns to my phone calendar</button></p></div>` : ''}
  <div class="card"><h2>Your documents</h2>${d.docs.length ? d.docs.map((x, i) => `<h3>${esc(x.t)} ${x.s === 'signed' || signed[x.t] ? '<span class="chip g">Signed</span>' : '<span class="chip w">Please read and sign</span>'}</h3><div class="doc">${esc(x.b)}</div>${x.s === 'signed' ? '' : `<p><button class="btn" data-act="tSign" data-arg="${i}">✍️ I have read this and I agree</button></p>`}`).join('') : '<p>No documents yet.</p>'}</div>
  ${d.sch.length ? `<div class="card"><h2>Your cleaning and garbage turns</h2><div class="week small"><b>Week of</b><b>Garbage to the curb</b><b>Cleans ${esc(d.fl)}</b></div>${d.sch.map((r, i) => `<div class="week ${i ? '' : 'now'}"><b>${nice(r.m).replace(/, \d{4}/, '')}</b><div>${me(r.g)}<div class="small">${esc(r.w)} · ${dn(addDays(r.pk, -1))} night</div></div><div>${me(r.c)}</div></div>`).join('')}
  <h3>What the weekly clean includes</h3><ul class="tight">${d.tasks.split('\n').filter(Boolean).map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="small">Finish by Sunday 8 pm. Need to swap a week? Agree with a housemate and tell the landlord.</p></div>` : ''}
  <div class="card"><h2>Need something?</h2><p>${esc(d.ll || 'Your landlord')}${d.lp ? ` · <a href="tel:${esc(d.lp)}">${esc(d.lp)}</a>` : ''}${d.le ? ` · <a href="mailto:${esc(d.le)}">${esc(d.le)}</a>` : ''}</p><p class="small">Page prepared ${nice(d.made)}.</p></div></main>`;
}
A.tSign = i => { const x = TP.docs[i], s = JSON.parse(localStorage.getItem('doorstep.signed') || '{}'); s[x.t] = today(); localStorage.setItem('doorstep.signed', JSON.stringify(s));
  const body = `I, ${TP.n}, have read and agree to "${x.t}" for ${TP.u}, ${TP.a}.\n\nDate: ${nice(today())}\nFull name: ${TP.n}`;
  if (TP.le) location.href = `mailto:${encodeURIComponent(TP.le)}?subject=${encodeURIComponent('Signed: ' + x.t)}&body=${encodeURIComponent(body)}`; else { copy(body); toast('Confirmation copied. Send it to your landlord.'); }
  renderTenant(); return false; };

/* ---------------- start ---------------- */
async function boot() {
  const m = location.hash.match(/^#t=(.+)/);
  if (m) { try { TP = await unpack(m[1]); renderTenant(); } catch (e) { $('#app').innerHTML = '<main><div class="card lock"><h2>This link is not complete</h2><p>Please ask your landlord to send it again.</p></div></main>'; } return; }
  const r = location.hash.match(/^#r=(.+)/);
  if (r) {
    try { PEND = await unpack(r[1]); if (!PEND.v || !PEND.properties) throw 0;
      $('#app').innerHTML = `<main><div class="card lock"><h1>🏠 Doorstep</h1><p>Open your saved copy from <b>${nice(PEND.settings.lastBackup)}</b> on this device?</p><p class="small">It replaces anything already saved in this browser.</p><p class="row" style="justify-content:center"><button class="btn" data-act="restoreYes">Yes, open it here</button><button class="btn sec" data-act="restoreNo">No</button></p></div></main>`;
    } catch (e) { $('#app').innerHTML = '<main><div class="card lock"><h2>This link is not complete</h2><p>Send yourself a fresh copy from Settings and try again.</p></div></main>'; }
    return;
  }
  load();
  if (!S.qc.last || daysBetween(S.qc.last, today()) >= 7) runQC(true);
  track(S.ui.view); save(); render();
}
window.addEventListener('hashchange', () => location.reload());
boot();
</script></body></html>
